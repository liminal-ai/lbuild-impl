name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  integration:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install real provider CLIs
        run: npm install --global @anthropic-ai/claude-code @github/copilot @openai/codex

      - name: Authenticate Codex CLI
        run: |
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
          codex login status

      - name: Show provider versions
        run: |
          claude --version
          codex --version
          copilot --version

      - name: Run verify-all
        run: npm run verify-all
